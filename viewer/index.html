<!DOCTYPE html>
<!--
  MẪU VIEWER — ĐỪNG SỬA TAY bản đã sinh ra. Chạy lib/viewer.py để dựng lại.

      python -m lib.viewer   (hoặc gọi build_viewer() từ script của dự án)

  Mỗi repo model công khai phải có một viewer để người xem hình dung được sản phẩm
  trước khi tải về in.

  Hai quyết định thiết kế, cả hai đều đã trả giá mới rút ra:

  1. HÌNH HỌC NHÚNG THẲNG vào file, không `fetch` file STL. Trình duyệt chặn đọc
     file cục bộ khi mở bằng file:// (CORS, origin `null`), nên bản dùng fetch chỉ
     chạy khi có máy chủ web — mở thẳng từ ổ đĩa là trắng trang. Nhúng vào thì chạy
     mọi nơi. Hình nhúng là bản GIẢM MẶT để xem, bản để in nằm ở stl/.

  2. Phụ thuộc ngoài DUY NHẤT three.min.js. Bộ giải nén, bộ đọc STL và điều khiển
     xoay đều viết thẳng ở dưới. Các file trong examples/js của three đã bị bỏ từ
     r148, ghim phiên bản để dùng chúng là một quả mìn hẹn giờ.

  Camera phải được đặt giá trị NGAY lúc khởi tạo, đừng đợi mô hình nạp xong —
  đó là lỗi đã làm trắng trang một lần rồi.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydroponic Succulent Planter — 3D preview</title>
<style>
  :root{--bg:#FAF6F2;--ink:#2A2320;--sub:#6B5F58;--line:#E4D9D1;--accent:#C08A8E;--teal:#5C7F72;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Avenir Next','Segoe UI',system-ui,sans-serif}
  header{padding:16px 18px 10px}
  h1{margin:0;font-size:16px;font-weight:600}
  header p{margin:6px 0 0;font-size:12px;color:var(--sub);line-height:1.55}
  #stage{position:relative;width:100%;height:60vh;min-height:340px;touch-action:none;cursor:grab}
  #stage.grabbing{cursor:grabbing}
  canvas{display:block}
  #drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    text-align:center;padding:24px;font-size:13.5px;line-height:1.6;color:var(--sub);
    pointer-events:none}
  #drop.on{display:flex}
  #drop.hot{background:rgba(250,246,242,.92);border:2px dashed var(--accent);color:var(--ink)}
  .panel{padding:12px 18px 22px}
  .parts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  button{font:inherit;font-size:12px;padding:6px 13px;border:1px solid var(--line);
    background:#fff;color:var(--ink);border-radius:20px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent)}
  button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  table{border-collapse:collapse;font-size:12px;width:100%;max-width:560px}
  th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line)}
  th{color:var(--sub);font-weight:500}
  td.num{font-variant-numeric:tabular-nums}
  .note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);line-height:1.65;max-width:640px}
</style>
</head>
<body>

<header>
  <h1 id="ttl"></h1>
  <p id="sub"></p>
</header>

<div id="stage">
  <div id="drop"></div>
</div>

<div class="panel">
  <div class="parts" id="parts"></div>
  <table><thead><tr><th id="h1"></th><th id="h2"></th><th id="h3"></th></tr></thead>
    <tbody id="tbl"></tbody></table>
  <div class="note" id="foot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// ─────────────────────────────────────────────── giải nén hình học nhúng
// Định dạng do lib/viewer.py sinh ra, gzip rồi base64:
//   uint32 nv | uint32 nf | uint8 idxBits | 3 byte đệm
//   float32 origin[3] | float32 scale[3]        (mm cho mỗi bước lượng tử)
//   uint16 pos[nv*3]                            (toạ độ lượng tử hoá)
//   uint16|uint32 idx[nf*3]
// Giải nén bằng DecompressionStream có sẵn trong trình duyệt — không thư viện nào.
async function decodeGeometry(b64) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const buf = await new Response(
    new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))
  ).arrayBuffer();

  const h = new DataView(buf);
  const nv = h.getUint32(0, true), nf = h.getUint32(4, true), idxBits = h.getUint8(8);
  const origin = new Float32Array(buf, 12, 3);
  const scale  = new Float32Array(buf, 24, 3);

  const q = new Uint16Array(buf, 36, nv * 3);
  const pos = new Float32Array(nv * 3);
  for (let i = 0; i < nv; i++) {
    pos[i * 3]     = origin[0] + q[i * 3]     * scale[0];
    pos[i * 3 + 1] = origin[1] + q[i * 3 + 1] * scale[1];
    pos[i * 3 + 2] = origin[2] + q[i * 3 + 2] * scale[2];
  }

  const off = 36 + nv * 6;
  const idx = idxBits === 16 ? new Uint16Array(buf, off, nf * 3)
                             : new Uint32Array(buf, off, nf * 3);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  return geo;
}

// ─────────────────────────────────────────────── bộ nạp STL cho file kéo thả
function parseSTL(buf) {
  const view = new DataView(buf);
  const head = new TextDecoder().decode(new Uint8Array(buf, 0, Math.min(84, buf.byteLength)));

  // File nhị phân: 80 byte tiêu đề + 4 byte số tam giác + 50 byte mỗi tam giác.
  // Kiểm bằng độ dài chứ không bằng chữ "solid" ở đầu — nhiều file nhị phân cũng
  // bắt đầu bằng "solid".
  const isBinary = buf.byteLength >= 84 &&
                   view.getUint32(80, true) * 50 + 84 === buf.byteLength;

  const pos = [], nrm = [];
  if (isBinary) {
    const n = view.getUint32(80, true);
    for (let i = 0; i < n; i++) {
      const o = 84 + i * 50;
      const nx = view.getFloat32(o, true), ny = view.getFloat32(o + 4, true),
            nz = view.getFloat32(o + 8, true);
      for (let v = 0; v < 3; v++) {
        const p = o + 12 + v * 12;
        pos.push(view.getFloat32(p, true), view.getFloat32(p + 4, true),
                 view.getFloat32(p + 8, true));
        nrm.push(nx, ny, nz);
      }
    }
  } else {
    const text = new TextDecoder().decode(new Uint8Array(buf));
    const facetRe = /facet\s+normal\s+([^]*?)endfacet/g;
    const numRe = /-?[\d.eE+-]+/g;
    let m;
    while ((m = facetRe.exec(text)) !== null) {
      const nums = m[1].match(numRe);
      if (!nums || nums.length < 12) continue;
      const [nx, ny, nz] = nums.slice(0, 3).map(Number);
      for (let v = 0; v < 3; v++) {
        pos.push(...nums.slice(3 + v * 3, 6 + v * 3).map(Number));
        nrm.push(nx, ny, nz);
      }
    }
    void head;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(nrm, 3));
  return geo;
}

const { x: bx, y: by } = CONFIG.bed;
const span = Math.max(bx, by);
const grid = new THREE.GridHelper(span, Math.round(span / 10), 0xD8CCC4, 0xEBE2DB);
grid.rotation.x = Math.PI / 2;
scene.add(grid);
scene.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.PlaneGeometry(bx, by)),
  new THREE.LineBasicMaterial({ color: 0xC7B8AE })));

const group = new THREE.Group();
scene.add(group);

// ─────────────────────────────────────────────── điều khiển xoay (toạ độ cầu, Z lên)
// Đặt giá trị khởi tạo NGAY, không đợi mô hình nạp xong. Đây chính là chỗ bản trước
// hỏng: camera nằm nguyên ở gốc toạ độ khi chưa có mesh nào -> trang trắng trơn.
const cam = { theta: -Math.PI / 2.6, phi: 1.15, dist: span * 1.15,
              target: new THREE.Vector3(0, 0, span * 0.08) };

function applyCamera() {
  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  camera.position.set(
    cam.target.x + cam.dist * sp * Math.cos(cam.theta),
    cam.target.y + cam.dist * sp * Math.sin(cam.theta),
    cam.target.z + cam.dist * cp);
  camera.lookAt(cam.target);
}

let drag = null;
stage.addEventListener("pointerdown", ev => {
  drag = { x: ev.clientX, y: ev.clientY, pan: ev.shiftKey || ev.button === 2 };
  stage.setPointerCapture(ev.pointerId);
  stage.classList.add("grabbing");
});
stage.addEventListener("pointermove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  drag.x = ev.clientX; drag.y = ev.clientY;
  if (drag.pan) {
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const up    = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    const k = cam.dist * 0.0018;
    cam.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
  } else {
    cam.theta -= dx * 0.008;
    cam.phi = Math.min(Math.PI - 0.05, Math.max(0.05, cam.phi - dy * 0.008));
  }
});
["pointerup", "pointercancel"].forEach(e => stage.addEventListener(e, ev => {
  drag = null;
  stage.classList.remove("grabbing");
  if (stage.hasPointerCapture?.(ev.pointerId)) stage.releasePointerCapture(ev.pointerId);
}));
stage.addEventListener("contextmenu", ev => ev.preventDefault());
stage.addEventListener("wheel", ev => {
  ev.preventDefault();
  cam.dist = Math.min(span * 8, Math.max(span * 0.06, cam.dist * Math.exp(ev.deltaY * 0.001)));
}, { passive: false });

// ─────────────────────────────────────────────── nạp chi tiết
let loaded = 0;

function addMesh(geo, part) {
  geo.computeBoundingBox();
  const b = geo.boundingBox;
  // Kích thước lấy từ mesh GỐC (ghi sẵn vào CONFIG lúc dựng), không lấy từ bản
  // giảm mặt — giảm mặt làm lệch vài phần mười mm, mà đây là số người ta đọc để
  // biết chi tiết có lọt vùng in không.
  const size = part.size
    ? new THREE.Vector3(...part.size)
    : new THREE.Vector3().subVectors(b.max, b.min);

  // Chỉ hạ đáy về 0 và căn giữa cho file KÉO THẢ (không biết gốc toạ độ của nó).
  // File của dự án đã đúng gốc toạ độ rồi, đụng vào là lệch cụm lắp ráp.
  if (part.normalize) {
    geo.translate(-(b.min.x + b.max.x) / 2, -(b.min.y + b.max.y) / 2, -b.min.z);
  }

  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
    color: part.color ?? 0xC08A8E }));
  const [px, py, pz] = part.position || [0, 0, 0];
  mesh.position.set(px, py, pz);
  group.add(mesh);

  addRow(part.name, `${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)}`,
         part.note || "");
  addToggle(part.name, mesh);

  if (++loaded === 1) fit();
  hint("");
}

function addRow(name, dims, note) {
  const tr = document.getElementById("tbl").insertRow();
  tr.insertCell().textContent = name;
  const d = tr.insertCell(); d.textContent = dims; d.className = "num";
  tr.insertCell().textContent = note;
}

function addToggle(name, mesh) {
  const b = document.createElement("button");
  b.textContent = name;
  b.setAttribute("aria-pressed", "true");
  b.onclick = () => {
    mesh.visible = !mesh.visible;
    b.setAttribute("aria-pressed", String(mesh.visible));
  };
  document.getElementById("parts").appendChild(b);
}

// Căn khung nhìn vào cụm mô hình, thay cho giá trị khởi tạo theo vùng in
function fit() {
  const box = new THREE.Box3().setFromObject(group);
  if (box.isEmpty()) return;
  box.getCenter(cam.target);
  cam.dist = Math.max(box.getSize(new THREE.Vector3()).length() * 1.5, 20);
}

// Hình học đi kèm ngay trong file này, không đọc file ngoài -> chạy cả với file://
(async () => {
  for (const part of CONFIG.parts) {
    try {
      addMesh(await decodeGeometry(part.data), part);
    } catch (e) {
      hint(`${UI.loadErr} ${part.name}: ${e.message}`);
    }
  }
  if (CONFIG.parts.length === 0) hint(UI.drop);
})();

// ─────────────────────────────────────────────── kéo thả (đường thoát cho file://)
["dragenter", "dragover"].forEach(e => stage.addEventListener(e, ev => {
  ev.preventDefault();
  hint(UI.drop, true);
}));
stage.addEventListener("dragleave", ev => {
  ev.preventDefault();
  hint(loaded === 0 ? UI.drop : "");
});
stage.addEventListener("drop", ev => {
  ev.preventDefault();
  hint("");
  [...ev.dataTransfer.files].filter(f => /\.stl$/i.test(f.name)).forEach(f => {
    const fr = new FileReader();
    fr.onload = () => addMesh(parseSTL(fr.result), {
      name: f.name.replace(/\.stl$/i, ""), color: 0xC08A8E,
      note: UI.dropped, normalize: true });
    fr.readAsArrayBuffer(f);
  });
});

// ─────────────────────────────────────────────── vòng vẽ
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

(function loop() {
  requestAnimationFrame(loop);
  applyCamera();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
